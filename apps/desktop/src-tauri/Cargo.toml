[package]
name = "reactive-resume-desktop"
version = "0.1.0"
description = "Reactive Resume desktop"
edition = "2021"

[lib]
name = "reactive_resume_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["webview-data-url"] }
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
