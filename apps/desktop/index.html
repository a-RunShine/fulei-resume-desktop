<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Reactive Resume</title>
		<style>
			body {
				font-family: sans-serif;
				margin: 2rem;
			}
			label {
				display: block;
				margin-bottom: 1rem;
			}
			input,
			textarea {
				display: block;
				width: 100%;
				margin-top: 0.25rem;
				font: inherit;
			}
			textarea {
				min-height: 8rem;
			}
			button {
				font: inherit;
				padding: 0.5rem 1rem;
			}
			#status,
			#provider-status,
			#reply {
				margin-top: 1rem;
			}
		</style>
	</head>
	<body>
		<form id="resume">
			<label>
				Name
				<input name="name" autocomplete="name" />
			</label>
			<label>
				Summary
				<textarea name="summary"></textarea>
			</label>
			<button type="submit">Export PDF</button>
		</form>
		<form id="provider">
			<label>
				Provider
				<input name="baseUrl" autocomplete="off" />
			</label>
			<label>
				Model
				<input name="model" autocomplete="off" />
			</label>
			<label>
				API key
				<input name="apiKey" type="password" autocomplete="off" />
			</label>
			<button type="submit">Save Provider</button>
		</form>
		<p id="provider-status"></p>
		<button id="ask" type="button">Ask Assistant</button>
		<p id="reply"></p>
		<p id="status" role="status"></p>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
